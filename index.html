<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Mobile cache-bust: nuke SW + caches on every fresh tab open
      (function() {
        if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) return;
        if (sessionStorage.getItem('cache_busted')) return;
        document.documentElement.style.display = 'none';
        sessionStorage.setItem('cache_busted', '1');
        Promise.all([
          navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              })
            : Promise.resolve(),
          typeof caches !== 'undefined'
            ? caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              })
            : Promise.resolve()
        ]).then(function() {
          location.reload();
        }).catch(function() {
          location.reload();
        });
      })();
    </script>
    <script>
      // Read saved theme from localStorage and apply BEFORE body paints
      (function() {
        function hslToHex(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;var c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');}return'#'+f(0)+f(8)+f(4);}
        // Decrypt localStorage values (mirrors src/shared/storage/index.ts)
        var EP='$e:',EK='gdays-ls-cipher-v1';
        function dec(v){if(!v||v.indexOf(EP)!==0)return v;try{var e=v.slice(EP.length),b=atob(e),kb=[];for(var i=0;i<EK.length;i++)kb.push(EK.charCodeAt(i));var r=[];for(var i=0;i<b.length;i++)r.push(b.charCodeAt(i)^kb[i%kb.length]);return String.fromCharCode.apply(null,r)}catch(x){return v}}
        function lsGet(k){return dec(localStorage.getItem(k))}
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var h, s, l;
        if (isMobile) {
          // Mobile: always black behind safe areas (Dynamic Island + home indicator)
          h = 0; s = 0; l = 0;
        } else {
          h = lsGet('bgHue');
          s = lsGet('bgSaturation');
          l = lsGet('bgLightness');
          h = h !== null ? parseFloat(h) : 52;
          s = s !== null ? parseFloat(s) : 100;
          l = l !== null ? parseFloat(l) : 91;
        }
        // Also read text color for CSS custom properties
        var th = lsGet('colorHue'); th = th !== null ? parseFloat(th) : 116;
        var ts = lsGet('colorSaturation'); ts = ts !== null ? parseFloat(ts) : 69;
        var tl = lsGet('colorLightness'); tl = tl !== null ? parseFloat(tl) : 24;
        // Set CSS custom properties on :root for all 6 color values
        var el = document.documentElement;
        el.style.setProperty('--h', th);
        el.style.setProperty('--s', ts + '%');
        el.style.setProperty('--l', tl + '%');
        el.style.setProperty('--bh', h);
        el.style.setProperty('--bs', s + '%');
        el.style.setProperty('--bl', l + '%');
        var bgColor = 'hsl(' + h + ',' + s + '%,' + l + '%)';
        var hexColor = hslToHex(h, s, l);
        document.getElementById('theme-color-meta').setAttribute('content', hexColor);
        document.write('<style>html,body{background-color:' + bgColor + '!important;margin:0;padding:0}</style>');
      })();
    </script>
    <meta property="og:title" content="good days" />
    <meta property="og:description" content="your digital-analog journal oasis" />
    <meta property="og:image" content="https://gdays.day/og-image.png" />
    <meta property="og:type" content="website" />
    <title>good days</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
